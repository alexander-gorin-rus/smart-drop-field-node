[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

upload_port = /dev/ttyACM0
monitor_speed = 115200

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit SHT31 Library
    sandeepmistry/LoRa

lib_ldf_mode = deep+